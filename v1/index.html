<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><title>VAŠ CHARLIE OS 1.0</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc}main{max-width:900px;margin:auto;padding:18px 14px 70px}.brand{color:#93c5fd;font-weight:900;letter-spacing:.12em;font-size:.82rem}h1{margin:.3rem 0}.sub{color:#94a3b8}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.status{padding:8px 10px;border:1px solid #334155;border-radius:999px;font-size:.78rem}.online{color:#86efac}.offline{color:#fcd34d}.card{background:#0f172a;border:1px solid #334155;border-radius:18px;padding:15px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}button,input,select{width:100%;min-height:48px;border-radius:12px;border:1px solid #475569;font:inherit}button{background:#2563eb;color:white;font-weight:800;padding:10px;cursor:pointer}button.secondary{background:#1e293b}button.success{background:#166534}input,select{background:#0b1220;color:#fff;padding:0 12px}.metric{background:#0b1220;border:1px solid #334155;border-radius:13px;padding:11px;text-align:center}.metric strong{display:block;font-size:1.25rem}.metric span{color:#94a3b8;font-size:.75rem}.map{height:260px;background:#0b1220;border:1px solid #334155;border-radius:15px;display:grid;place-items:center;text-align:center;color:#94a3b8;margin-top:10px}.log{font-family:ui-monospace,monospace;font-size:.8rem;color:#cbd5e1;white-space:pre-wrap}.version{margin-top:20px;color:#64748b;font-size:.75rem;text-align:center}@media(max-width:620px){.grid,.grid3{grid-template-columns:1fr}}
</style></head>
<body><main>
<div class="top"><div><div class="brand">VAŠ CHARLIE OS</div><h1 id="appName">VAŠ CHARLIE OS 1.0</h1><p class="sub" id="subtitle">Taxi • posao • navigacija • financije</p></div><div id="net" class="status">...</div></div>
<section class="card"><div class="grid"><button id="start">Pokreni vožnju</button><button id="finish" class="success">Završi vožnju</button></div><div class="grid" style="margin-top:10px"><button id="pause" class="secondary">Pauza</button><button id="resume" class="secondary">Nastavi</button></div><div class="grid3" style="margin-top:10px"><div class="metric"><strong id="km">0.00</strong><span>km</span></div><div class="metric"><strong id="mins">0</strong><span>min</span></div><div class="metric"><strong id="gps">--</strong><span>GPS</span></div></div></section>
<section class="card"><h2 id="navTitle">🗺️ Navigacija</h2><div class="grid"><input id="destination" placeholder="Odredište"><button id="route">Izračunaj rutu</button></div><div class="map" id="map"><div><strong>Offline navigacija</strong><br><span id="mapText">GPS će raditi i bez interneta. Offline karta/routing paket učitava se lokalno.</span></div></div></section>
<section class="card"><h2 id="settingsTitle">⚙️ Postavke</h2><label id="languageLabel">Jezik</label><select id="language"></select></section>
<div class="version">LANA 1.0.0 • OS 1.0.0 • offline-first</div>
<div id="log" class="log"></div></main><script type="module" src="app.js"></script></body></html>
