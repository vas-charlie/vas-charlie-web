<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Lana novi glas — VAŠ CHARLIE</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#edf6ff;background:#07111f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#081426,#0b1d36 60%,#07111f)}
    main{max-width:760px;margin:auto;padding:18px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-weight:900;font-size:1.15rem}.badge{font-size:.78rem;padding:6px 9px;border-radius:999px;background:#123760;color:#bfe1ff}
    .hero{margin-top:18px;min-height:34vh;border:1px solid #244f7d;border-radius:24px;background:radial-gradient(circle at 50% 35%,#183d69 0,#0d213c 45%,#081426 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
    .face{font-size:4rem}.hero h1{margin:8px 0 2px;font-size:2rem}.hero p{margin:0;color:#a9c8e8;line-height:1.5}.clock{font-weight:800;color:#d9efff;margin-top:12px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{min-height:58px;border:0;border-radius:16px;background:#1458b0;color:#fff;font-weight:850;font-size:.96rem;padding:10px;box-shadow:0 8px 20px rgba(0,0,0,.18)}button.alt{background:#17477f}button.stop{background:#831d28}button:disabled{opacity:.55}
    .status{margin-top:14px;border:1px solid #244f7d;border-radius:16px;background:#0b1b31;padding:13px;min-height:64px;line-height:1.5;color:#cfe8ff}.small{font-size:.82rem;color:#91afd0;margin-top:10px;line-height:1.45}
    @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.hero{min-height:42vh}}
  </style>
</head>
<body><main>
  <div class="top"><div class="title">LANA • novi govorni modul</div><div class="badge">testna grana</div></div>
  <section class="hero"><div><div class="face">🎙️</div><h1>Lana</h1><p>Prirodni glas preko zasebnog audio modula.<br>Bez Android speechSynthesis.</p><div id="clock" class="clock"></div></div></section>
  <div class="grid">
    <button data-key="standard">👋 Pozdravi</button>
    <button data-key="warm" class="alt">🙂 Topli pozdrav</button>
    <button data-key="returning" class="alt">🔁 Stalni klijent</button>
    <button data-key="exit" class="alt">👋 Hvala / doviđenja</button>
    <button id="stop" class="stop">■ Zaustavi govor</button>
  </div>
  <div id="status" class="status">Spremno. Dodirni jedan pozdrav.</div>
  <div class="small">Pozdrav se automatski mijenja prema dobu dana. Ovaj ekran ne dira produkcijsku Lanu.</div>
</main>
<script>
(()=>{'use strict';
  const status=document.getElementById('status'),clock=document.getElementById('clock');
  let currentAudio=null,currentUrl=null,requestToken=0;
  const cache=new Map();

  function timeGreeting(){
    const h=new Date().getHours();
    if(h>=5&&h<12)return 'Dobro jutro';
    if(h>=12&&h<18)return 'Dobar dan';
    return 'Dobra večer';
  }
  function refreshClock(){const d=new Date();clock.textContent=`${timeGreeting()} • ${d.toLocaleTimeString('hr-HR',{hour:'2-digit',minute:'2-digit'})}`}
  refreshClock();setInterval(refreshClock,30000);

  function textFor(key){
    const g=timeGreeting();
    const texts={
      standard:`${g} i dobrodošli. Hvala vam što ste odabrali VAŠ CHARLIE. Želim vam ugodnu i sigurnu vožnju.`,
      warm:`${g}. Dobrodošli u VAŠ CHARLIE. Smjestite se udobno. Ako vam nešto zatreba tijekom vožnje, slobodno recite. Želim vam ugodnu vožnju.`,
      returning:`${g} i dobrodošli ponovno. Drago mi je što ste opet s VAŠ CHARLIE. Hvala vam na povjerenju i želim vam ugodnu vožnju.`,
      exit:`Hvala vam na vožnji i povjerenju. VAŠ CHARLIE vam želi ugodan nastavak dana i sretan put. Doviđenja.`
    };
    return texts[key];
  }

  function stop(){
    requestToken++;
    if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null}
    if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}
  }

  async function getAudio(text){
    if(cache.has(text))return cache.get(text);
    const r=await fetch('/api/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,voice:'shimmer'})});
    if(!r.ok){let detail='';try{detail=(await r.json()).error||''}catch{}throw new Error(detail||`HTTP ${r.status}`)}
    const blob=await r.blob();
    if(!blob.size)throw new Error('Primljen je prazan audio zapis.');
    cache.set(text,blob);return blob;
  }

  async function play(key,button){
    stop();const my=++requestToken,text=textFor(key);
    document.querySelectorAll('[data-key]').forEach(b=>b.disabled=true);button.disabled=false;
    status.textContent='🎙️ Lana priprema glas…\n'+text;
    try{
      const blob=await getAudio(text);if(my!==requestToken)return;
      currentUrl=URL.createObjectURL(blob);currentAudio=new Audio(currentUrl);currentAudio.preload='auto';
      currentAudio.onplay=()=>{status.textContent='🔊 Lana govori…\n'+text};
      currentAudio.onended=()=>{status.textContent='✅ Poruka je izgovorena do kraja.\n'+text;document.querySelectorAll('[data-key]').forEach(b=>b.disabled=false);if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}currentAudio=null};
      currentAudio.onerror=()=>{status.textContent='❌ Audio se nije mogao reproducirati.';document.querySelectorAll('[data-key]').forEach(b=>b.disabled=false)};
      await currentAudio.play();
    }catch(e){status.textContent='❌ Novi govorni modul: '+(e.message||'nepoznata greška');document.querySelectorAll('[data-key]').forEach(b=>b.disabled=false)}
  }

  document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>play(b.dataset.key,b)));
  document.getElementById('stop').addEventListener('click',()=>{stop();document.querySelectorAll('[data-key]').forEach(b=>b.disabled=false);status.textContent='Govor zaustavljen.'});
})();
</script></body></html>
