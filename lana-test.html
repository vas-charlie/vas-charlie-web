<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lana TTS dijagnostika</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1020;color:#f8fafc;margin:0}main{max-width:760px;margin:auto;padding:18px}.card{background:#111827;border:1px solid #334155;border-radius:18px;padding:16px;margin-top:14px}button{width:100%;min-height:52px;border:0;border-radius:14px;background:#1d4ed8;color:white;font-weight:800;font-size:1rem;margin:6px 0}.secondary{background:#315f9f}.danger{background:#7f1d1d}.status{white-space:pre-wrap;line-height:1.5;color:#bfdbfe}.muted{color:#94a3b8;font-size:.9rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.voice{padding:8px 0;border-bottom:1px solid #1e293b;font-size:.85rem}.ok{color:#bbf7d0}.bad{color:#fecaca}</style></head><body><main><h1>LANA • TTS dijagnostika</h1><p class="muted">Ovo ne dira produkciju. Cilj je otkriti zašto Android vraća synthesis-failed.</p><section class="card"><div class="grid"><button id="probe">🔎 Provjeri glasove</button><button id="hr" class="secondary">🇭🇷 Test hrvatski</button><button id="en" class="secondary">🇬🇧 Test English</button><button id="stop" class="danger">■ Stop</button></div><div id="status" class="status">Spremno.</div></section><section class="card"><strong>Dostupni glasovi na uređaju</strong><div id="voices" class="muted" style="margin-top:10px">Još nisu učitani.</div></section></main><script>(()=>{const s=document.getElementById('status'),vbox=document.getElementById('voices');let voices=[];function load(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}render();return voices}function render(){if(!('speechSynthesis'in window)){vbox.innerHTML='<span class="bad">speechSynthesis nije podržan.</span>';return}if(!voices.length){vbox.innerHTML='<span class="bad">Preglednik trenutno ne vidi nijedan instalirani TTS glas.</span>';return}vbox.innerHTML=voices.map(v=>`<div class="voice">${v.name} • ${v.lang}${v.localService?' • lokalni':''}${v.default?' • zadani':''}</div>`).join('')}function pick(lang){return voices.find(v=>v.lang.toLowerCase().startsWith(lang))||voices.find(v=>v.default)||voices[0]||null}function speak(text,lang){if(!('speechSynthesis'in window)){s.textContent='❌ speechSynthesis nije dostupan.';return}load();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text),voice=pick(lang);if(voice)u.voice=voice;u.lang=voice?.lang||(lang==='hr'?'hr-HR':'en-US');u.rate=.9;u.volume=1;u.onstart=()=>s.textContent='🔊 Govor je pokrenut.\nGlas: '+(voice?voice.name+' ('+voice.lang+')':'nije pronađen');u.onend=()=>s.textContent='✅ Test izgovoren do kraja.\nGlas: '+(voice?voice.name+' ('+voice.lang+')':'nije pronađen');u.onerror=e=>s.textContent='❌ Greška govora: '+(e.error||'nepoznata')+'\nGlas: '+(voice?voice.name+' ('+voice.lang+')':'nije pronađen')+'\nBroj dostupnih glasova: '+voices.length;try{speechSynthesis.speak(u)}catch(e){s.textContent='❌ Iznimka: '+e.message}}document.getElementById('probe').onclick=()=>{load();s.textContent='Pronađeno glasova: '+voices.length+'\nHrvatskih: '+voices.filter(v=>v.lang.toLowerCase().startsWith('hr')).length};document.getElementById('hr').onclick=()=>speak('Dobar dan i dobrodošli u VAŠ CHARLIE. Želim vam ugodnu vožnju.','hr');document.getElementById('en').onclick=()=>speak('Hello and welcome. This is a voice test.','en');document.getElementById('stop').onclick=()=>{try{speechSynthesis.cancel()}catch{}s.textContent='Govor zaustavljen.'};try{speechSynthesis.onvoiceschanged=()=>load()}catch{}setTimeout(load,250);setTimeout(load,1200)})();</script></body></html>
