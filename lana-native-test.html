<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lana native voice test</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#071226;color:#fff;margin:0}main{max-width:760px;margin:auto;padding:18px}.card{background:#0d1c36;border:1px solid #244978;border-radius:22px;padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{min-height:58px;border:0;border-radius:16px;background:#0f4fb6;color:#fff;font-size:1rem;font-weight:850;padding:10px}.secondary{background:#165c9d}.danger{background:#8f1515}.status{margin-top:14px;padding:14px;border:1px solid #244978;border-radius:16px;line-height:1.45;background:#09162c}.muted{color:#9eb4d4}.time{font-size:1.2rem;font-weight:850;margin-top:10px}</style></head><body><main><h1>LANA • native voice test</h1><p class="muted">Bez kartice. Govor ide kroz Androidov ugrađeni TTS, ne kroz preglednik i ne kroz Vercel AI Gateway.</p><section class="card"><div class="time" id="time"></div><div class="grid"><button data-key="standard">👋 Pozdravi</button><button class="secondary" data-key="warm">🙂 Topli pozdrav</button><button class="secondary" data-key="returning">🔁 Stalni klijent</button><button class="secondary" data-key="exit">👋 Hvala / doviđenja</button><button class="danger" id="stop">■ Zaustavi govor</button></div><div class="status" id="status">Pokreni ovu stranicu iz native testne aplikacije.</div></section></main><script>(()=>{const status=document.getElementById('status'),time=document.getElementById('time');function greet(){const h=new Date().getHours();return h<11?'Dobro jutro':h<18?'Dobar dan':'Dobra večer'}function text(k){const g=greet();const map={standard:`${g} i dobrodošli u VAŠ CHARLIE. Hvala vam što ste odabrali VAŠ CHARLIE. Želim vam ugodnu vožnju.`,warm:`${g}. Smjestite se udobno. Ako vam nešto zatreba tijekom vožnje, slobodno recite. Želim vam ugodnu vožnju.`,returning:`${g} i dobrodošli ponovno. Drago mi je što ste opet s VAŠ CHARLIE. Želim vam ugodnu vožnju.`,exit:`Hvala vam na vožnji i povjerenju. Ako želite, nakon vožnje slobodno ostavite iskrenu recenziju. Želim vam sretan nastavak dana.`};return map[k]}function refresh(){time.textContent=`${greet()} • ${new Date().toLocaleTimeString('hr-HR',{hour:'2-digit',minute:'2-digit'})}`}refresh();setInterval(refresh,30000);window.nativeVoiceReady=v=>status.textContent='✅ Native glas spreman: '+v;window.nativeVoiceError=e=>status.textContent='❌ Native TTS greška: '+e;document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(!window.LanaNative){status.textContent='❌ Ova stranica nije otvorena iz native Lana aplikacije.';return}const t=text(b.dataset.key);const ok=window.LanaNative.speak(t);status.textContent=ok?'🔊 Lana govori: '+t:'❌ Native glas još nije spreman.'});document.getElementById('stop').onclick=()=>{window.LanaNative?.stop();status.textContent='Govor zaustavljen.'};setTimeout(()=>{if(window.LanaNative){status.textContent=window.LanaNative.isReady()?'✅ Native glas je spreman: '+window.LanaNative.voiceName():'⏳ Native glas se učitava...'}},500)})();</script></body></html>
