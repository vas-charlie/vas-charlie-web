name: Build Lana Native Voice APK

on:
  push:
    branches: [lana-stable-rebuild-v2]
    paths:
      - 'android-native/**'
      - '.github/workflows/lana-native-voice.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-native
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lana-native-voice-test
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
